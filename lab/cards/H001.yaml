id: H001
parent: null
family: 合成方法
kind: 防雷型
mechanism: >-
  合成时某一组分数缺失就跳过，等于用其余几组的平均替这只股票打分。一家在"便宜""跌得多"上分数极高、又没有
  季度利润超预期数据的公司，会因为少了一组可能拉低它的分数而被推到最前面。缺数据本身也和风险相关：
  "超预期"要连续 8 个季度的单季利润，季报不齐、晚报、更正多的公司算不出来。多因子实务里的通行做法是把缺失的
  描述变量按截面平均（标准化后的 0）计入，而不是丢掉这一项（Barra 风险模型对缺失描述变量的处理；
  Grinold & Kahn《Active Portfolio Management》关于信号缺失时向均值收缩）。这是合成方法本身的偏差，
  不依赖某个制度阶段；在退市变真之后（2019 年起），缺数据的公司更可能是真出事的公司，所以那一段影响最大。
change: 某一组分数缺失时，按 0（截面平均）计入族间平均，而不是跳过；一组都没有的股票仍然没有总分
prediction:
  metric: 三.大亏只数
  direction: 降
falsification: >-
  阶段三的大亏只数没有比基线少三成；或者阶段三的收益反而变差；或者全段的配对差值明显为负（t 值不高于 −1）
variant:
  missing: zero
seen_before: >-
  看过 lab/evidence/E001.md（基线顶端各档、前 50 名里带标记的股票、第一次戴 ST 前后）和 E002.md
  （基线大亏持仓的样子、缺"超预期"的股票在顶端的占比和之后表现）。这张卡就是看了 E002 之后写的：
  阶段三缺失的股票在前 15 名里占 56%、之后 20 天平均 −1.5%。以前还看过计划 3d 在 2019–2021 的逐只盈亏。
  开发段已经没有干净的数据，这张卡的结果只能说明"改动有没有按机制起作用"，不能当作样本外证据。
status: 已采纳
result: >-
  第 2 次账户检验采纳（lab/reports/H001-r2.md）：阶段三大亏 21 → 14（少 33%，门槛 30%），阶段三年化 2.3% → 14.3%，
  全段配对差值 +3.1 个点、t 值 2.33；阶段一、二几乎不变（+1.0、−0.2）。第 1 次运行因程序错误作废。
  阶段三仍比能持有等权少 7.5 个点；前 15 名之后 20 天年化 10.1%，仍低于前 150 名的 22.3%。
