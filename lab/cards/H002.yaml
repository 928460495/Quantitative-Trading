seen_before: >-
  看过 lab/evidence/E003.md：阶段三里"跌得多"单独打分时最好的五分之一比全体少 5.2 个点，前 15 名跌超两成的只数是随机的
  近 3 倍；阶段一、二里它是正的（+2.1、+6.8）。也看过 E001、E002 和 H001 的结果。这张卡是看了 E003 之后写的，
  开发段上的结果只能说明机制有没有起作用，不算样本外证据。
status: 已采纳
result: >-
  第 1 次账户检验采纳（lab/reports/H002-r1.md）：阶段三大亏 14 → 5（少 64%），阶段三年化 14.3% → 17.6%；
  全段配对差值 −0.65 个点、t 值 −0.26（门槛 > −1）；阶段二少 3.9 个点。全段大亏 28 → 14，年成本 2.0% → 1.2%。
  阶段三仍比能持有等权少 4.1 个点；前 15 名之后 20 天年化 12.6%，最好五分之一 25.2%。
