id: H002
parent: H001
family: 因子族
kind: 防雷型
mechanism: >-
  "跌得多"这一组买的是过去 60–250 天跌得最多、离一年高点最远的股票。过去收益低是公司陷入困境最强的预警变量之一
  （Campbell, Hilscher & Szilagyi 2008, "In Search of Distress Risk"：低的过去收益、低市值、高波动预测破产和退市，
  困境股之后的收益反而更低）。A 股的价格类异象本来就弱：Jansen, Swinkels & Zhou（2021，2000–2019 年 32 个异象）
  发现过去收益类异象在 A 股明显弱于价值、风险和交易类；Leippold, Wang & Zhou（2022）发现价格趋势不是重要的预测变量。
  退市变真之后（2020-12 新规），"跌得多"的极端端更可能是真要退市的公司，而不是会反弹的超跌股。
  合成里还留着"便宜""冷门""业绩超预期"三组，逆向的部分由"便宜""冷门"保留。
change: 去掉"跌得多"这一组（ret60、ret120、high52w、lit_high52w、a158_MA60、a158_QTLU60、a158_ROC60、a158_MAX60），其余三组等权
prediction:
