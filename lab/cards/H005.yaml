id: H005
parent: H002
family: 合成方法
kind: 防雷型
mechanism: >-
  现在族间合成是把各组的标准分直接平均。标准分没有上限：一家公司只要在某一组极端（比如"便宜"的标准分到 3、4 以上），
  其他组平平甚至偏低，也能凭这一组冲到最前面；而单个因子的极端端正是数据错误和困境公司聚集的地方（B5、B6、B13）。
  Novy-Marx（2013, "The Quality Dimension of Value Investing"）合成价值和盈利时用的是各自排名的平均；
  AQR（Fitzgibbons 等 2017, "Long-Only Style Investing: Don't Just Mix, Integrate"）也指出，整合打分要防止买到
  在一个维度上极端、在其他维度上很差的股票。改用各组百分位排名的平均：一组再极端，最多贡献 +0.5，
  要排到最前面必须几组都靠前。
change: 族间合成改用各组百分位排名（居中到 ±0.5）的平均，而不是各组标准分的平均；缺失的组仍按 0（中间排名）计入
prediction:
  metric: 三.大亏只数
  direction: 降
falsification: >-
  阶段三的大亏只数没有比基线少三成；或者阶段三的收益反而变差；或者全段的配对差值明显为负（t 值不高于 −1）
variant:
  blend: rank
seen_before: >-
  没有看过排名平均在开发段的任何结果（先登记再看）。看过 E001–E003 和 H001–H004 的结果；B13（单组证据推不到合成之后的顶端）、
  H004 的大亏只数大降，是写这张卡的线索。基线（H002 之后）阶段三的大亏只数是 5，少三成要降到 3 以下，事件很少、偶然性大。
  开发段上的结果只能说明机制有没有起作用，不算样本外证据。
status: 已采纳
result: >-
  第 1 次账户检验采纳（lab/reports/H005-r1.md）：阶段三大亏 5 → 0，阶段三年化 17.6% → 22.0%（能持有等权 21.8%）；
  三个阶段配对差值 +0.2、+1.2、+3.6 个点，全段 +1.4 个点、t 值 0.86。全段年化 18.6%，最大回撤 −45.3%。
  阶段三前 15 名之后 20 天年化 24.3%（全体 22.2%）。阶段三超额只有 +0.2 个点，最差起点 −2.8 个点。
